aid: editas-medicine
name: Editas Medicine
description: 'Editas Medicine is a clinical-stage genome editing company headquartered in Cambridge,
  Massachusetts, developing durable, precision CRISPR-based gene editing medicines for people with
  serious diseases. The company works across in vivo and ex vivo approaches and holds foundational
  CRISPR/Cas9 and Cas12a intellectual property, advancing a pipeline that has included programs in
  sickle cell disease, beta-thalassemia and inherited retinal disorders. Editas Medicine trades on
  Nasdaq under the ticker EDIT and was surfaced in the API Evangelist network as a portfolio company
  of GV (Google Ventures). As a life-sciences research and therapeutics organization it publishes a
  corporate and investor-relations web presence rather than a public developer API, so this profile
  captures its identity, web properties, and probed domain-security posture.'
